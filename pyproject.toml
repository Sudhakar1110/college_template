[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "college_template"
version = "0.0.1"
description = "College ERP Customizations - Doctypes, Scripts, Reports & Dashboard"
authors = [
    {name = "Bizaxl", email = "info@bizaxl.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
# Frappe app dependencies (education, lms) are managed by bench via hooks.py
# No Python pip packages required for this fixture-based app
dependencies = []

[tool.setuptools.packages.find]
include = ["college_template*"]
